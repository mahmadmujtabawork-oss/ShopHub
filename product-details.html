<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details — ShopHub</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body>

    <header class="navbar dark-nav">
        <div class="container nav-wrap">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Shop<span class="accent">Hub</span></span>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="product.html" class="nav-link">Products</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn wishlist-btn">
                    <i class="fa-solid fa-heart"></i>
                    <span class="cart-count wishlist-count" id="wishlistCount">0</span>
                </a>
                <a href="cart.html" class="icon-btn cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <a href="admin.html" class="icon-btn">
                    <i class="fa-solid fa-user-shield"></i>
                </a>
                <button class="hamburger" id="hamburger">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
        <nav class="mobile-menu" id="mobileMenu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link">Products</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="wishlist.html" class="nav-link">Wishlist</a>
            <a href="cart.html" class="nav-link">Cart</a>
        </nav>
    </header>

    <section class="section" style="padding-top: 100px;">
        <div class="container" id="productDetailContent">
            <div class="loader">Loading product details...</div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-grid">
            <div class="footer-col">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Shop<span class="accent">Hub</span></span>
                </a>
                <p>Your one-stop destination for quality products.</p>
            </div>
            <div class="footer-col">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 ShopHub. All rights reserved.</p>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>
    <script src="script.js"></script>
</body>
</html>
